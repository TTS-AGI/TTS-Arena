[supervisord]
nodaemon=true
# No user= here: the entrypoint passes -u root when it starts as root, and
# runs supervisord unprivileged when the container starts as uid 1000. Either
# way every program below runs as `app` (uid 1000).
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

# The TTS router (internal, :8080). Runs from source via Bun.
[program:router]
command=bun /app/apps/router/src/index.ts
directory=/app
user=app
environment=PORT="8080",NODE_ENV="production",HOME="/home/app",USER="app"
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# The Next.js web app on the port HF exposes (:7860). DATABASE_URL and
# AUDIO_LOG_DIR (set by the entrypoint) are inherited from supervisord's
# environment, like the other Space secrets.
[program:web]
command=bun /app/standalone/apps/web/server.js
directory=/app/standalone
user=app
environment=PORT="7860",HOSTNAME="0.0.0.0",NODE_ENV="production",ROUTER_URL="http://127.0.0.1:8080",HOME="/home/app",USER="app"
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
