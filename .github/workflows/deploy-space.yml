name: Deploy to Hugging Face Space

# Pushes the repo to the HF Space and syncs Space secrets. Runs after CI passes
# on main. The Space README and Dockerfile are derived during the sync so the
# GitHub repo keeps its own.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: false

permissions:
  contents: read

env:
  HF_OWNER: TTS-AGI
  HF_SPACE: TTS-Arena-V2

jobs:
  deploy:
    name: Sync to Space
    runs-on: ubuntu-latest
    # Only deploy on manual dispatch, or when CI succeeded for a push to this
    # repo (never for a fork's or a pull request's CI run).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true # pull the prompt corpus content, not just LFS pointers

      - name: Sync deployment secrets to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Explicit allowlist: only the secrets the Space runtime (web, router,
          # providers) or its Docker build actually reads. Every SPACE_SECRET__X
          # entry below is synced to the Space as X; unset/empty ones are
          # skipped. Never pass toJSON(secrets) here — it would ship every repo
          # secret (deploy tokens included) to the Space.
          # App core
          SPACE_SECRET__DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPACE_SECRET__SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SPACE_SECRET__ADMIN_USERS: ${{ secrets.ADMIN_USERS }}
          SPACE_SECRET__ROUTER_API_KEY: ${{ secrets.ROUTER_API_KEY }}
          SPACE_SECRET__HCAPTCHA_SECRET: ${{ secrets.HCAPTCHA_SECRET }}
          SPACE_SECRET__HF_OAUTH_CLIENT_ID: ${{ secrets.HF_OAUTH_CLIENT_ID }}
          SPACE_SECRET__HF_OAUTH_CLIENT_SECRET: ${{ secrets.HF_OAUTH_CLIENT_SECRET }}
          SPACE_SECRET__APP_URL: ${{ secrets.APP_URL }}
          SPACE_SECRET__SECURITY_DISABLED: ${{ secrets.SECURITY_DISABLED }}
          SPACE_SECRET__PGSSL_NO_VERIFY: ${{ secrets.PGSSL_NO_VERIFY }}
          SPACE_SECRET__DB_POOL_MAX: ${{ secrets.DB_POOL_MAX }}
          SPACE_SECRET__ERROR_RETENTION_DAYS: ${{ secrets.ERROR_RETENTION_DAYS }}
          SPACE_SECRET__GENERATION_RETENTION_DAYS: ${{ secrets.GENERATION_RETENTION_DAYS }}
          # Private providers: plugin list + the build secret the Space's Docker
          # build mounts to clone them.
          SPACE_SECRET__PROVIDER_PLUGINS: ${{ secrets.PROVIDER_PLUGINS }}
          SPACE_SECRET__PRIVATE_PROVIDERS_TOKEN: ${{ secrets.PRIVATE_PROVIDERS_TOKEN }}
          # Public provider credentials (packages/providers/*)
          SPACE_SECRET__AUDIO8_ENDPOINT_URL: ${{ secrets.AUDIO8_ENDPOINT_URL }}
          SPACE_SECRET__AUDIO8_HF_TOKEN: ${{ secrets.AUDIO8_HF_TOKEN }}
          SPACE_SECRET__AUDIO8_SERVICE_KEY: ${{ secrets.AUDIO8_SERVICE_KEY }}
          SPACE_SECRET__CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          SPACE_SECRET__CHATTERBOX_API_KEY: ${{ secrets.CHATTERBOX_API_KEY }}
          SPACE_SECRET__DEEPDUB_API_KEY: ${{ secrets.DEEPDUB_API_KEY }}
          SPACE_SECRET__ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SPACE_SECRET__FLUXIONS_API_KEY: ${{ secrets.FLUXIONS_API_KEY }}
          SPACE_SECRET__GRADIUM_API_KEY: ${{ secrets.GRADIUM_API_KEY }}
          SPACE_SECRET__HITHINK_API_URL: ${{ secrets.HITHINK_API_URL }}
          SPACE_SECRET__HUME_API_KEY: ${{ secrets.HUME_API_KEY }}
          SPACE_SECRET__INWORLD_API_KEY: ${{ secrets.INWORLD_API_KEY }}
          SPACE_SECRET__MARS_API_KEY: ${{ secrets.MARS_API_KEY }}
          SPACE_SECRET__MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          SPACE_SECRET__MINIMAX_GROUP_ID: ${{ secrets.MINIMAX_GROUP_ID }}
          SPACE_SECRET__RUMIK_API_KEY: ${{ secrets.RUMIK_API_KEY }}
          SPACE_SECRET__SMALLEST_API_KEY: ${{ secrets.SMALLEST_API_KEY }}
          SPACE_SECRET__TONTAUBE_API_KEY: ${{ secrets.TONTAUBE_API_KEY }}
          SPACE_SECRET__TYPECAST_API_KEY: ${{ secrets.TYPECAST_API_KEY }}
          SPACE_SECRET__UNI_API_KEY: ${{ secrets.UNI_API_KEY }}
          SPACE_SECRET__UNI_BASE_URL: ${{ secrets.UNI_BASE_URL }}
          SPACE_SECRET__VENUS_API_KEY: ${{ secrets.VENUS_API_KEY }}
          SPACE_SECRET__VENUS_BASE_URL: ${{ secrets.VENUS_BASE_URL }}
          SPACE_SECRET__VOICEAI_API_KEY: ${{ secrets.VOICEAI_API_KEY }}
          SPACE_SECRET__VUILABS_API_KEY: ${{ secrets.VUILABS_API_KEY }}
          # Private-provider credentials, as ONE repo secret holding a JSON
          # object ({"NAME":"value",...}), so their names stay out of this
          # public file. Optional; merged under the named secrets above.
          EXTRA_SPACE_SECRETS_JSON: ${{ secrets.EXTRA_SPACE_SECRETS_JSON }}
        run: |
          # Build the JSON blob set-secrets.sh expects from the allowlist above.
          # Values travel via env only (never argv or logs).
          ALL_SECRETS="$(python3 - <<'PY'
          import json, os, re, sys
          out = {}
          extra = os.environ.get("EXTRA_SPACE_SECRETS_JSON", "").strip()
          if extra:
              try:
                  data = json.loads(extra)
              except Exception:
                  sys.exit("EXTRA_SPACE_SECRETS_JSON is not valid JSON")
              if not isinstance(data, dict):
                  sys.exit("EXTRA_SPACE_SECRETS_JSON must be a JSON object")
              for k, v in data.items():
                  if re.fullmatch(r"[A-Z][A-Z0-9_]*", str(k)) and isinstance(v, str):
                      out[k] = v
          prefix = "SPACE_SECRET__"
          for k, v in os.environ.items():
              if k.startswith(prefix) and v:
                  out[k[len(prefix):]] = v
          print(json.dumps(out))
          PY
          )"
          export ALL_SECRETS
          chmod +x deploy/space/set-secrets.sh
          deploy/space/set-secrets.sh "${HF_OWNER}/${HF_SPACE}"

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PRIVATE_PROVIDERS_TOKEN: ${{ secrets.PRIVATE_PROVIDERS_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          REMOTE="https://${HF_OWNER}:${HF_TOKEN}@huggingface.co/spaces/${HF_OWNER}/${HF_SPACE}"

          # Build a Space-flavored copy of the repo (no .git). The private
          # providers are NOT vendored here — the Space's Docker build clones
          # them itself using the PRIVATE_PROVIDERS_TOKEN Space secret (mounted
          # as a build secret), so the private source never enters the Space
          # repo and the Space can be made public safely.
          rsync -a --exclude='.git' --exclude='node_modules' ./ /tmp/space/
          # Space README + Dockerfile take precedence; GitHub's stay in the repo.
          mv /tmp/space/SPACES_README.md /tmp/space/README.md
          mv /tmp/space/Dockerfile.space /tmp/space/Dockerfile

          # Cache-bust the private-providers clone layer. That RUN clones a repo
          # behind a fixed command, so Docker reuses a stale layer and the Space
          # keeps an OLD snapshot of the private repo forever (new private models
          # never appear). Stamp the private repo's current HEAD SHA into the
          # Dockerfile's PRIVATE_PROVIDERS_REF default so the layer's cache key
          # changes whenever the private repo changes. Read the repo path from
          # the Dockerfile default (authoritative) rather than a secret whose
          # format we can't rely on.
          REPO="$(sed -n 's/^ARG PRIVATE_PROVIDERS_REPO=//p' /tmp/space/Dockerfile | head -1)"
          REPO="${REPO:-TTS-AGI/private-providers}"
          if [ -z "${PRIVATE_PROVIDERS_TOKEN:-}" ]; then
            echo "note: PRIVATE_PROVIDERS_TOKEN not available to this job"
          fi
          # Resolve HEAD via the GitHub API (works reliably with fine-grained
          # PATs); fall back to git ls-remote. Either way it's non-fatal.
          REF="$(curl -sf \
            -H "Authorization: Bearer ${PRIVATE_PROVIDERS_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/commits/HEAD" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["sha"])' 2>/dev/null || true)"
          if [ -z "$REF" ]; then
            REF="$(git ls-remote "https://x-access-token:${PRIVATE_PROVIDERS_TOKEN}@github.com/${REPO}.git" HEAD 2>/dev/null | cut -f1)"
          fi
          if [ -n "$REF" ]; then
            sed -i "s|^ARG PRIVATE_PROVIDERS_REF=.*|ARG PRIVATE_PROVIDERS_REF=${REF}|" /tmp/space/Dockerfile
            echo "pinned private providers ref to ${REF:0:7}"
          else
            # Last resort: a timestamp still busts the cache every deploy (the
            # clone always fetches latest), at the cost of no layer reuse.
            STAMP="$(date -u +%Y%m%d%H%M%S)"
            sed -i "s|^ARG PRIVATE_PROVIDERS_REF=.*|ARG PRIVATE_PROVIDERS_REF=ts-${STAMP}|" /tmp/space/Dockerfile
            echo "WARNING: could not resolve private HEAD; busting cache with timestamp ts-${STAMP}" >&2
          fi

          # Deploy as a single fresh commit (orphan history). This keeps the
          # Space itself (repo + config) intact while ensuring no stray blob
          # from past history can block the push (HF rejects binaries even from
          # history). The prompt corpus ships via Git LFS; everything else is
          # text (bun.lock is the text lockfile).
          cd /tmp/space
          git init -q
          git lfs install --local
          # Honor the repo's LFS rules and ensure the corpus is LFS-tracked.
          git lfs track "apps/web/data/combined_prompts.txt"
          git checkout -q -b main
          git add -A
          git commit -q -m "Deploy from github.com/${{ github.repository }}@${GITHUB_SHA::7}"
          # Sanity: the corpus must be an LFS object, not an inlined blob.
          git lfs ls-files | grep -q combined_prompts.txt \
            || { echo "ERROR: prompt corpus is not LFS-tracked"; exit 1; }
          git push -f "$REMOTE" main
